services:
  - type: web
    name: wind-forecast-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATA_MODE
        value: real
      - key: FETCH_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
